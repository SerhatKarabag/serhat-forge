name: Cloud .NET Tests

on:
  push:
    paths:
      - "Samples~/GameApiBackend/**"
      - "cloudscript-azure-functions-monetization/**"
      - "Packages/com.serhat.backend-sdk/Runtime/Core/**"
      - "Packages/com.serhat.monetization-sdk/Runtime/**"
      - "Directory.Build.props"
      - ".github/workflows/cloud-tests.yml"
  pull_request:
    paths:
      - "Samples~/GameApiBackend/**"
      - "cloudscript-azure-functions-monetization/**"
      - "Packages/com.serhat.backend-sdk/Runtime/Core/**"
      - "Packages/com.serhat.monetization-sdk/Runtime/**"
      - "Directory.Build.props"
      - ".github/workflows/cloud-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: .NET 8 release tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore cloud test graph
        run: >-
          dotnet restore
          "Samples~/GameApiBackend/tests/Serhat.Forge.CloudScript.Tests.csproj"
          --nologo

      - name: Run release tests with warnings as errors
        run: >-
          dotnet test
          "Samples~/GameApiBackend/tests/Serhat.Forge.CloudScript.Tests.csproj"
          --configuration Release
          --no-restore
          --nologo
          --property:TreatWarningsAsErrors=true
