name: Unity tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unity ${{ matrix.testMode }}
    if: >-
      ${{
        vars.RUN_UNITY_CI == 'true' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}

      - name: Upload Unity test results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-test-${{ matrix.testMode }}-${{ github.run_attempt }}
          path: |
            artifacts/${{ matrix.testMode }}
            Logs/
          if-no-files-found: warn
          retention-days: 14

# Enable this workflow by setting repository variable RUN_UNITY_CI=true and
# configuring the appropriate Personal or Professional Unity license secrets
# documented by GameCI. Fork pull requests are intentionally skipped because
# repository secrets are not exposed to them.
