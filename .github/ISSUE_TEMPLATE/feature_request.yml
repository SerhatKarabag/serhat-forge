name: Feature request
description: Propose a reusable, project-agnostic improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the recurring project need, not only the desired API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include lifecycle, optional dependency, migration, and platform implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The proposal is reusable across multiple games rather than tied to one game's domain.
          required: true
        - label: I identified any required third-party SDK or license impact.
          required: true
